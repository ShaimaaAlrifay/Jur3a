# Writes and publishes today's issue every morning, then emails it.
# Needs one secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` on your Mac and paste the result).
name: Daily issue

on:
  schedule:
    - cron: "12 4 * * *"  # 07:12 Riyadh — main run
    - cron: "41 4 * * *"  # 07:41 Riyadh — backup in case GitHub delayed or dropped the first (does nothing if today's issue exists)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test: write tomorrow's issue but don't publish or email"
        type: boolean
        default: false
      test_alert:
        description: "Test: fail on purpose to check the failure email"
        type: boolean
        default: false

concurrency:
  group: daily-issue
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the failure alert
        if: inputs.test_alert == true
        run: |
          echo "Failing on purpose to test the alert email."
          exit 1

      - name: Check setup and today's date
        id: pre
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN is not set yet; skipping."; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            TODAY=$(TZ=Asia/Riyadh date -d tomorrow +%F); WEEKDAY=$(TZ=Asia/Riyadh date -d tomorrow +%A)
            echo "DRY RUN for $TODAY"
            git remote set-url --push origin DISABLED_IN_DRY_RUN   # makes any push impossible
          else
            TODAY=$(TZ=Asia/Riyadh date +%F); WEEKDAY=$(TZ=Asia/Riyadh date +%A)
          fi
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "weekday=$WEEKDAY" >> "$GITHUB_OUTPUT"
          if python3 -c "import json,sys; sys.exit(0 if any(i['date']=='$TODAY' for i in json.load(open('issues.json'))['issues']) else 1)"; then
            echo "Issue for $TODAY already exists."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

      - name: Write the issue with Claude
        if: steps.pre.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            TODAY: ${{ steps.pre.outputs.today }}
            WEEKDAY: ${{ steps.pre.outputs.weekday }}
            DRY_RUN: ${{ inputs.dry_run == true }}

            Read prompts/daily-action.md and follow it exactly.
            If DRY_RUN is true: do every step including the commit, but DO NOT run git push.
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3:*),Bash(git:*),Bash(ls:*),Bash(grep:*),Bash(cat:*),Bash(head:*),Bash(wc:*)"

      - name: Check the test issue (dry run)
        if: steps.pre.outputs.go == 'true' && inputs.dry_run == true
        run: |
          TODAY=${{ steps.pre.outputs.today }}
          python3 - <<PY
          import json, os, re
          d = json.load(open("issues.json", encoding="utf-8"))["issues"]
          i = [x for x in d if x["date"] == "$TODAY"]
          assert i, "no issue written for $TODAY"
          i = i[-1]; f = f"issues/{i['slug']}.html"
          assert os.path.exists(f), f"{f} missing"
          t = open(f, encoding="utf-8").read()
          assert not re.search("[٠-٩]", t), "Arabic-Indic digits found"
          print("OK:", i["number"], i["topic"], "|", i["title"], "|", len(t), "bytes")
          PY
          git log --oneline -1
          if git status -sb | grep -q ahead; then echo "Committed locally, not pushed (as expected)."; fi
          git fetch -q origin main
          git show origin/main:issues.json | grep -q "\"date\": \"$TODAY\"" && { echo "::error::Dry run pushed to main!"; exit 1; } || echo "main untouched."

      - name: Save the test issue
        if: steps.pre.outputs.go == 'true' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-issue
          path: |
            issues/*.html
            src/*.html
            issues.json

      - name: Confirm it was published
        id: post
        if: steps.pre.outputs.go == 'true' && inputs.dry_run != true
        run: |
          git fetch -q origin main
          TODAY=${{ steps.pre.outputs.today }}
          if git show origin/main:issues.json | python3 -c "import json,sys; sys.exit(0 if any(i['date']=='$TODAY' for i in json.load(sys.stdin)['issues']) else 1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No issue for $TODAY was pushed."; exit 1
          fi

      # Pushes made inside a workflow don't start other workflows, so deploy and email from here.
      - name: Rebuild GitHub Pages
        if: steps.post.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."

      - name: Email subscribers
        if: steps.post.outputs.published == 'true'
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          git pull -q origin main
          sleep 90
          python3 scripts/notify.py

      - name: Alert the owner if anything failed
        if: failure()
        env:
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          user, pw = os.environ.get("SMTP_USER"), os.environ.get("SMTP_PASSWORD")
          if not (user and pw):
              raise SystemExit("No Gmail credentials for the alert.")
          body = "ما انتشر عدد اليوم من جرعة.\n\nسجل التشغيل:\n" + os.environ["RUN_URL"] + "\n\nتقدرين تعيدينه من Actions ← Daily issue ← Run workflow."
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = "⚠️ جرعة: فشل النشر"
          msg["From"] = user
          msg["To"] = user
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pw)
              s.send_message(msg)
          print("alert sent")
          PY
