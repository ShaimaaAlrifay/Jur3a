<section class="join" id="subscribe" hidden>
  <div class="join-in">
    <h2 class="join-title" aria-label="خلك قريب من كل فكرة تستحق تعرفها">خلـــك قريب من كل فكـــرة<br><em>تستحـــق تعرفـــها</em></h2>
    <p class="join-sub">كل صباح، جرعة جديدة.. ومعرفة تفتح لك ألف باب.</p>
    <form class="join-form" method="post" target="_blank" data-form="subscribe">
      <label class="sr" for="sub-email">إيميلك</label>
      <div class="join-field">
        <input id="sub-email" type="email" name="email" required placeholder="name@example.com" dir="ltr" autocomplete="email">
        <button type="submit"><span>اشترك</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 17L7 7M7 7v9M7 7h9"/></svg></button>
      </div>
      <input type="hidden" name="embed" value="1">
      <details class="join-topics">
        <summary>وش يهمك أكثر؟</summary>
        <div class="chips">
          <label><input type="checkbox" name="metadata__interests" value="tech"><span>تقنية وبرمجة</span></label>
          <label><input type="checkbox" name="metadata__interests" value="business"><span>ريادة ومنتجات</span></label>
          <label><input type="checkbox" name="metadata__interests" value="marketing"><span>تسويق</span></label>
          <label><input type="checkbox" name="metadata__interests" value="health"><span>صحة بدنية ونفسية</span></label>
          <label><input type="checkbox" name="metadata__interests" value="skills"><span>مهارات</span></label>
          <label><input type="checkbox" name="metadata__interests" value="culture"><span>أدب وتراث</span></label>
        </div>
      </details>
    </form>
    <p class="join-msg" role="status" aria-live="polite"></p>
  </div>
</section>
<section class="suggest" id="suggest" hidden>
  <h2 class="join-title small">اقترحوا علينا موضوع</h2>
  <p class="join-sub">فيه شي تبون تفهمونه أكثر؟ قولوا لنا، وممكن يكون عدد جاي.</p>
  <form class="suggest-form" data-form="suggest">
    <label for="sg-topic">الموضوع</label>
    <input id="sg-topic" name="topic" required maxlength="120" placeholder="مثلاً: الاستثمار للمبتدئين، أو الكتابة الإبداعية">
    <label for="sg-why">ليش يهمكم؟ (اختياري)</label>
    <textarea id="sg-why" name="why" rows="3" maxlength="600"></textarea>
    <label for="sg-email">إيميلكم إذا تبون نرد عليكم (اختياري)</label>
    <input id="sg-email" type="email" name="email" dir="ltr" placeholder="name@example.com">
    <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">أرسلوا الاقتراح</button>
  </form>
  <p class="join-msg" role="status" aria-live="polite"></p>
</section>
