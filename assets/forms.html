<section class="join" id="subscribe" hidden>
  <div class="join-in">
    <h2 class="join-title" aria-label="خلك قريب من كل فكرة تستحق تعرفها">خلـــك قريب من كل فكـــرة<br><em>تستحـــق تعرفـــها</em></h2>
    <p class="join-sub">كل صباح، جرعة جديدة.. ومعرفة تفتح لك ألف باب.</p>
    <form class="join-form" method="post" target="_blank" data-form="subscribe">
      <label class="sr" for="sub-email">إيميلك</label>
      <div class="join-field">
        <input id="sub-email" type="email" name="email" required placeholder="name@example.com" dir="ltr" autocomplete="email">
        <button type="submit"><span>اشترك</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 17L7 7M7 7v9M7 7h9"/></svg></button>
      </div>
      <input type="hidden" name="embed" value="1">
      <details class="join-topics">
        <summary>وش يهمك أكثر؟</summary>
        <label class="sr" for="sub-interests">المواضيع اللي تهمك</label>
        <input id="sub-interests" class="join-interests" type="text" name="metadata__interests" maxlength="200" placeholder="اكتب المواضيع اللي تهمك، مثلاً: الذكاء الاصطناعي، الاستثمار، الكتابة" autocomplete="off">
      </details>
    </form>
    <p class="join-msg" role="status" aria-live="polite"></p>
  </div>
</section>
